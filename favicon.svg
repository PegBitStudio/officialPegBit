<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- Navy background with rounded corners -->
  <rect width="64" height="64" rx="12" fill="#0A0A1A"/>
  <!-- Hexagon (pointy-top, centered) -->
  <polygon points="32,10 51,21 51,43 32,54 13,43 13,21"
           fill="none"
           stroke="url(#hexGrad)"
           stroke-width="3"
           stroke-linejoin="round"/>
  <!-- Inner dot for "presence" -->
  <circle cx="32" cy="32" r="3" fill="url(#hexGrad)"/>
</svg>
